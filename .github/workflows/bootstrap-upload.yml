name: Bootstrap source files

on:
  push:
    branches: [main]
    paths:
      - xiaotuxiu-source.zip
      - .github/workflows/bootstrap-upload.yml

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore repository files
        run: |
          unzip -o xiaotuxiu-source.zip -x '.github/workflows/deploy-pages.yml'
          rm -f xiaotuxiu-source.zip
      - name: Commit complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Upload complete Xiaotuxiu source"
          git push
